services:
  - type: web
    name: creatorspark
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn creatorspark.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
